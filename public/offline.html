<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>اتصال قطع است | فریلنس‌هاب</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Vazir, Tahoma, Arial, sans-serif;
        background: #f9fafb;
        color: #111827;
        padding: 2rem;
        text-align: center;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #101828;
          color: #f3f4f6;
        }
      }
      .card {
        max-width: 28rem;
        border-radius: 1.25rem;
        padding: 2rem;
        border: 1px solid rgba(148, 163, 184, 0.35);
        background: rgba(148, 163, 184, 0.08);
      }
      h1 {
        font-size: 1.35rem;
        margin: 0 0 0.75rem;
      }
      p {
        margin: 0 0 1.5rem;
        line-height: 1.9;
        opacity: 0.8;
      }
      a {
        display: inline-block;
        padding: 0.75rem 1.5rem;
        border-radius: 0.9rem;
        background: #4a6dff;
        color: #fff;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>اتصال اینترنت قطع است</h1>
      <p>
        صفحه‌ای که درخواست کردید کش نشده بود. پس از برقراری دوبارهٔ اتصال، دکمهٔ زیر را
        بزنید. داده‌های نمایش‌داده‌شدهٔ قبلی در همین دستگاه باقی مانده‌اند.
      </p>
      <a href="/">تلاش دوباره</a>
    </main>
  </body>
</html>
